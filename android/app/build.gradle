plugins {
    id 'com.android.application'
}

def releaseNumber = (project.findProperty('VERSION_CODE') ?: '1') as Integer

android {
    namespace 'com.bingeretro.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.bingeretro.app'
        minSdk 24
        targetSdk 34
        versionCode releaseNumber
        versionName "1.0.${releaseNumber}"
        buildConfigField 'String', 'APP_URL', "\"${project.findProperty('APP_URL') ?: 'https://bingeretro.ai.studio'}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
